name: jungle_hockey
description: Air hockey multijoueur local (multitouch) pour tablette Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0 # Flutter >= 3.27 (Color.withValues)

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/decor/
    - assets/sounds/
